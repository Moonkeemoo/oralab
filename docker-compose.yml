services:
  postgres:
    image: postgres:16-alpine
    container_name: ora2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ora
      POSTGRES_PASSWORD: ora
      POSTGRES_DB: ora_v2
    ports:
      - "5432:5432"
    volumes:
      - ora2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ora -d ora_v2"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ora2-pgdata:
